services:
  - type: web
    name: horouf-static-preview
    runtime: static
    repo: https://github.com/Mohamadabdallah55/horouf
    branch: main
    buildCommand: bun install --frozen-lockfile && bun run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://horouf-1.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
  - type: web
    name: codenames-static-preview
